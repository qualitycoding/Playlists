name: probe-s000a
on:
  push:
    branches: [ probe/s000a ]
permissions:
  contents: write
concurrency:
  group: probe-s000a
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe hosts and runner (no secrets used)
        run: |
          mkdir -p probe-results
          {
            echo "date: $(date -u +%FT%TZ)"
            echo "image: $ImageOS $ImageVersion"
            echo "python3: $(python3 --version 2>&1)"
            for v in 3.12 3.13; do echo "python$v: $(command -v python$v || echo absent)"; done
            echo "node: $(node --version)"
            for u in https://api.discogs.com/ https://openapi.tidal.com/v2 https://login.tidal.com/ https://www.googleapis.com/youtube/v3/playlists https://oauth2.googleapis.com/token https://pypi.org/simple/ https://registry.npmjs.org/; do
              echo "host $u -> $(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$u" 2>&1 | tail -c 120)"
            done
          } > probe-results/hosts.txt
          cat probe-results/hosts.txt
      - name: Count public collection (no secrets)
        run: python3 probe_collection.py
      - name: Commit results
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add probe-results
          git commit -m "probe: S-000a host and runner results" 
          git push origin HEAD:probe/s000a
